name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor the packages declare in `engines`; 22 and 24 are the
        # LTS lines people actually run. Testing only some of them means the
        # rest are supported by assertion rather than by evidence.
        node: [20, 22, 24]
        # And each one in a different timezone — west of UTC, at it, east of
        # it — because a calendar day read through the wrong clock is off by
        # one in only one of them. It costs no job: the zone rides on the Node
        # version. Jest hands a test a copy of `process.env`, so a test cannot
        # set `TZ` for itself; the process has to start with it.
        include:
          - node: 20
            tz: America/Mexico_City
          - node: 22
            tz: UTC
          - node: 24
            tz: Asia/Tokyo

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (TZ=${{ matrix.tz }})
        run: npm test -- --coverage
        env:
          TZ: ${{ matrix.tz }}

      # The release tooling decides a version nobody reviews and publishes
      # something nobody can unpublish, so it is checked on the way in rather
      # than on the way out.
      - name: Test the release tooling
        run: npm run test:scripts

  scaffold:
    # The CLI's real contract is that the project it writes builds and passes its
    # own tests. Checking that the CLI compiles proves nothing about its output,
    # so this job generates a project and runs it.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Scaffold a project with every optional feature on
        run: |
          node packages/cli/dist/bin/monolite.js new smoke-full \
            --database=postgres --auth --example --yes --skip-install --skip-git

      - name: Scaffold the minimal project
        run: |
          node packages/cli/dist/bin/monolite.js new smoke-min \
            --database=none --no-auth --no-example --yes --skip-install --skip-git

      - name: No placeholder survived the render
        run: |
          if grep -rn '__[a-zA-Z]*__' smoke-full smoke-min; then
            echo "::error::an unrendered placeholder reached the generated project"
            exit 1
          fi
