# The six-engine claim, checked against the engines it is made about.
#
# `ci.yml` runs the unit suite, which verifies the packages against an array and
# two doubles. That cannot catch the class of bug where the engine and the double
# disagree, and that class shipped repeatedly: a transaction the repositories did
# not join, a soft-delete flag the SQL driver never wrote, `ON DELETE RESTRICT`
# on an engine that has no such clause, and a `CALL` the connector could not make
# at all. Every one of them passed every unit test.
#
# It is a workflow of its own because it costs five database servers and a couple
# of minutes, and `npm test` has to stay runnable with nothing installed — that
# is what makes it the command anybody runs before a commit.
name: Integration

on:
  push:
    branches: [master]
  pull_request:
  # Available by hand, for a branch that touches a driver and wants the answer
  # before opening anything.
  workflow_dispatch:

jobs:
  engines:
    name: Every engine
    runs-on: ubuntu-latest
    # Oracle alone takes over a minute to open, and the suite runs one engine at
    # a time on purpose.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: monolite
          POSTGRES_USER: monolite
          POSTGRES_DB: monolite
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U monolite -d monolite"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 30

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: monolite
          MYSQL_DATABASE: monolite
        ports: ["55306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmonolite --silent"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40

      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Monolite_2026!"
          MSSQL_PID: Developer
        ports: ["51433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Monolite_2026! -C -Q 'SELECT 1' || exit 1"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 40

      mongo:
        image: mongo:7
        ports: ["57017:27017"]
        # A replica set of one, initiated from the health check so the whole
        # thing stays in this file. MongoDB refuses to open a transaction on a
        # standalone, and transactions are half of what this suite checks.
        options: >-
          --health-cmd "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }\" | grep -q 1"
          --health-interval 3s
          --health-timeout 10s
          --health-retries 40
        # The set advertises an address only reachable inside the container, so
        # the driver is told not to go looking; see `MONGO_OPTIONS` below.

      oracle:
        # The community build of Oracle Database Free. Far smaller than the
        # vendor image and it needs no registry login, which is what makes it
        # runnable here at all.
        image: gvenzl/oracle-free:slim
        env:
          ORACLE_PASSWORD: monolite
          APP_USER: monolite
          APP_USER_PASSWORD: monolite
        ports: ["51521:1521"]
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 10s
          --health-retries 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite refuses to skip an engine it was asked for, so naming all five
      # here is what makes a server that failed to come up a red build rather
      # than a quiet one. "Integration tests passed" has to mean something.
      - name: Run the suite against all five
        run: npm run test:integration
        env:
          MONOLITE_IT_ENGINES: postgres,mysql,mssql,oracle,mongodb
          MONOLITE_IT_MONGO_OPTIONS: directConnection=true

      # It also generates the schema it runs against, from the entity metadata,
      # so a green run is a statement about the DDL generator too. Worth saying
      # out loud in the log rather than leaving in a comment.
      - name: What that just verified
        if: success()
        run: |
          echo "::notice::The generated DDL was applied to PostgreSQL, MySQL, SQL Server and Oracle,"
          echo "::notice::the shared repository contract passed on all five engines, and transactions,"
          echo "::notice::row locks and stored procedures were exercised against real servers."
