# Only the engine this project chose. A compose file listing five databases is
# a compose file where `docker compose up` starts four you do not need.
services:
  mysql:
    image: mysql:8
    container_name: __projectName__-mysql
    restart: unless-stopped
    environment:
      # Root exists so the image can boot and apply the schema; the API always
      # connects as MYSQL_USER.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:-__dbUser__}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-__dbName__}
    ports:
      # 3306 is usually taken by a local install, so the published port defaults
      # to something else and the app reads it from MYSQL_PORT.
      - "${MYSQL_PORT:-__dbPort__}:__dbContainerPort__"
    volumes:
      - mysql_data:/var/lib/mysql
      # The image runs these once, in order, already connected to
      # MYSQL_DATABASE, so the scripts need no USE statement. Put the schema
      # here: the application never creates tables.
      - ./docker/mysql:/docker-entrypoint-initdb.d
    healthcheck:
      # Forced over TCP against 127.0.0.1 rather than the socket: the temporary
      # server that applies the init scripts starts with --skip-networking, so
      # answering on the port is exactly the signal that the schema is in place.
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
